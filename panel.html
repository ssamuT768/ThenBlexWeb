<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThenBlex · Bot Panel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>

  <div class="dashboard fade-in-dashboard">
    <!-- Navbar superior -->
    <nav class="navbar">
      <div class="nav-brand">ThenBlex</div>
      <div class="nav-links">
        <a href="index.html" class="nav-btn">Info</a>
        <a href="redes.html" class="nav-btn">Redes</a>
        <a href="panel.html" class="nav-btn active">Panel</a>
        <a href="coming.html" class="nav-btn">Coming Soon</a>
      </div>
    </nav>

    <!-- Contenido Principal Panel Horizontal con todas las opciones -->
    <main class="content-container panel-container">
      <h1 class="dashboard-title">Bot Control Panel</h1>
      
      <div class="panel-horizontal-box">
        <!-- Fila 1: Conexión Básica -->
        <div class="panel-section-title">Connection Settings</div>
        <div class="panel-row">
          <div class="input-field-group">
            <label>Server IP</label>
            <input type="text" id="server-ip" placeholder="127.0.0.1" autocomplete="off">
          </div>

          <div class="input-field-group">
            <label>Port</label>
            <input type="text" id="server-port" placeholder="19132" autocomplete="off">
          </div>

          <div class="input-field-group">
            <label>Bots Count</label>
            <input type="number" id="bots-count" placeholder="5" min="1" max="50">
          </div>

          <div class="input-field-group">
            <label>Prefix / Name</label>
            <input type="text" id="bot-prefix" placeholder="ThenBlex_" autocomplete="off">
          </div>
        </div>

        <!-- Fila 2: Funciones avanzadas (AutoRegister & AutoChatCode) -->
        <div class="panel-section-title" style="margin-top: 15px;">Automation Options</div>
        <div class="panel-row">
          <div class="input-field-group">
            <label>AutoRegister Password</label>
            <input type="password" id="register-pass" placeholder="Password123" autocomplete="off">
          </div>

          <div class="input-field-group checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="autochat-toggle" checked>
              <span>Enable AutoChatCode (Scan verification)</span>
            </label>
          </div>

          <div class="input-field-group checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="autoregister-toggle" checked>
              <span>Enable AutoRegister</span>
            </label>
          </div>
        </div>

        <!-- Fila 3: Botones de Acción -->
        <div class="panel-row buttons-row" style="margin-top: 20px;">
          <button class="panel-action-btn start-btn" onclick="startBots()">Start Bots</button>
          <button class="panel-action-btn stop-btn" onclick="stopBots()">Stop Bots</button>
        </div>
      </div>
    </main>

    <!-- Pie de página -->
    <footer class="footer">
      <span class="version-text">Version: 2.0.1</span>
    </footer>
  </div>

  <script>
    function startBots() {
      const ip = document.getElementById("server-ip").value;
      const port = document.getElementById("server-port").value;
      const count = document.getElementById("bots-count").value;
      
      if(!ip || !port) {
        alert("Por favor ingresa la IP y el Puerto del servidor.");
        return;
      }
      alert(`Iniciando ${count || 1} bots hacia ${ip}:${port}... (Conectando con Render API)`);
      // Aquí conectaremos la API con tu script de Python en Render próximamente
    }

    function stopBots() {
      alert("Deteniendo todos los bots...");
    }
  </script>
</body>
</html>
