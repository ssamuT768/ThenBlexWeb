<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThenBlex · Web Launcher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0F0F12;
      color: #F4F4F5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #16161A;
      border: 1px solid #2A2A35;
      border-radius: 14px;
      padding: 24px;
      width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    h2 { color: #38BDF8; margin-top: 0; font-size: 20px; margin-bottom: 16px; }
    .group { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    label { font-size: 13px; color: #A1A1AA; width: 130px; }
    input {
      width: 240px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #2A2A35;
      background-color: #1C1C22;
      color: #FFF;
      box-sizing: border-box;
      font-size: 13px;
    }
    .btn-row { display: flex; gap: 10px; margin-top: 18px; }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-start { background-color: #22C55E; color: white; }
    .btn-start:hover { background-color: #16A34A; }
    .btn-stop { background-color: #EF4444; color: white; }
    .btn-stop:hover { background-color: #DC2626; }
    #log {
      margin-top: 16px;
      background: #000;
      color: #38BDF8;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 11px;
      height: 110px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>ThenBlex Bot Launcher</h2>
    
    <div class="group">
      <label>Host / IP</label>
      <input type="text" id="host" value="127.0.0.1">
    </div>
    <div class="group">
      <label>Puerto</label>
      <input type="number" id="port" value="19132">
    </div>
    <div class="group">
      <label>Nombre base</label>
      <input type="text" id="name" value="ThenBlexBot">
    </div>
    <div class="group">
      <label>Cantidad Bots</label>
      <input type="number" id="bots" value="1">
    </div>
    <div class="group">
      <label>Hold (seg)</label>
      <input type="number" id="hold" value="20">
    </div>
    <div class="group">
      <label>Timeout (seg)</label>
      <input type="number" id="timeout" value="6">
    </div>
    <div class="group">
      <label>Cooldown (seg)</label>
      <input type="number" step="0.1" id="coldown" value="0.5">
    </div>

    <div class="btn-row">
      <button class="btn-start" onclick="sendStart()">START</button>
      <button class="btn-stop" onclick="sendStop()">STOP</button>
    </div>

    <div id="log">Sistema listo. Esperando acciones...</div>
  </div>

  <script>
    // ⚠️ REEMPLAZA ESTA URL CON TU URL REAL DE RENDER CUANDO ESTÉ DESPLEGADO
    const RENDER_URL = "https://tu-proyecto.onrender.com";

    async function sendStart() {
      const host = document.getElementById('host').value.trim();
      const port = parseInt(document.getElementById('port').value);
      const name = document.getElementById('name').value.trim();
      const bots = parseInt(document.getElementById('bots').value);
      const hold = parseInt(document.getElementById('hold').value);
      const timeout = parseInt(document.getElementById('timeout').value);
      const coldown = parseFloat(document.getElementById('coldown').value);

      appendLog("Enviando parámetros de inicio a Render...");

      try {
        const res = await fetch(`${RENDER_URL}/api/start`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host, port, name, bots, hold, timeout, coldown })
        });
        const data = await res.json();
        appendLog(data.message || "Petición procesada con éxito.");
      } catch (e) {
        appendLog("Error: No se pudo conectar con el servidor backend.");
      }
    }

    async function sendStop() {
      appendLog("Enviando orden de parada...");
      try {
        const res = await fetch(`${RENDER_URL}/api/stop`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        appendLog(data.message || "Señal de parada enviada.");
      } catch (e) {
        appendLog("Error al intentar detener los bots.");
      }
    }

    function appendLog(text) {
      const logBox = document.getElementById('log');
      logBox.innerText += "\n> " + text;
      logBox.scrollTop = logBox.scrollHeight;
    }
  </script>
</body>
</html>
